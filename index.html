<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photorealistic Broadcast Cricket Simulator</title>
    <style>
        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030308; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        canvas { width: 100%; height: 100%; outline: none; touch-action: none; display: block; }
        
        #broadcast-hud {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(5,5,15,0.95) 0%, rgba(20,20,50,0.95) 100%);
            color: white; border-radius: 4px; border-bottom: 4px solid #ffcc00;
            display: flex; align-items: center; padding: 12px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 100; pointer-events: none;
            width: 650px; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .team-score { font-size: 30px; display: flex; align-items: center; gap: 12px; font-weight: 800; font-family: 'Impact', sans-serif; letter-spacing: 2px; }
        .team-ind { color: #0085ff; }
        .team-aus { color: #ffcc00; }
        .match-info { text-align: center; font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1.5px; line-height: 1.4;}
        
        #director-cam {
            position: absolute; top: 20px; right: 20px; background: rgba(200, 0, 0, 0.9);
            color: white; padding: 6px 12px; font-weight: bold; border-radius: 2px; z-index: 100; font-size: 11px; letter-spacing: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-transform: uppercase; pointer-events: none;
        }
    </style>
    <!-- Babylon.js Full Engine & Materials Library -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
</head>
<body>

    <div id="director-cam">CAM: BROADCAST STUMP CAM</div>
    
    <div id="broadcast-hud">
        <div class="team-score"><span style="color:#aaa; font-size:18px;">IND</span> <span class="team-ind">314/5</span></div>
        <div class="match-info" id="commentary">Overs: 48.4 | CRR: 6.46<br><b style="color:#fff; font-size:14px;">Fluid Kinematics Engine Online</b></div>
        <div class="team-score"><span class="team-aus">AUS</span></div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById("renderCanvas");
            const engine = new BABYLON.Engine(canvas, true);

            const createScene = function () {
                const scene = new BABYLON.Scene(engine);
                scene.clearColor = new BABYLON.Color4(0.02, 0.05, 0.12, 1); // Deep night stadium sky
                scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
                scene.fogColor = new BABYLON.Color3(0.02, 0.05, 0.12);
                scene.fogDensity = 0.003;

                // Broadcast Cinematic Camera
                const camera = new BABYLON.UniversalCamera("Cam", new BABYLON.Vector3(0, 4, -22), scene);
                camera.setTarget(new BABYLON.Vector3(0, 1, 9));

                // High-Intensity Floodlight Setup
                const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
                hemi.intensity = 0.4;
                hemi.groundColor = new BABYLON.Color3(0.1, 0.2, 0.1);

                const floodlight1 = new BABYLON.SpotLight("fl1", new BABYLON.Vector3(-60, 100, -40), new BABYLON.Vector3(0, -1, 0), Math.PI / 3, 2, scene);
                floodlight1.intensity = 80.0;
                floodlight1.diffuse = new BABYLON.Color3(1, 0.95, 0.85);

                const floodlight2 = new BABYLON.SpotLight("fl2", new BABYLON.Vector3(60, 100, -40), new BABYLON.Vector3(0, -1, 0), Math.PI / 3, 2, scene);
                floodlight2.intensity = 80.0;
                floodlight2.diffuse = new BABYLON.Color3(1, 0.95, 0.85);

                const shadowGen = new BABYLON.ShadowGenerator(2048, floodlight1);
                shadowGen.useBlurExponentialShadowMap = true;
                shadowGen.blurKernel = 32;

                // Turf & Stadium Floor
                const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 400, height: 400}, scene);
                const gMat = new BABYLON.StandardMaterial("gMat", scene);
                gMat.diffuseColor = new BABYLON.Color3(0.12, 0.35, 0.12);
                gMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
                ground.material = gMat;
                ground.receiveShadows = true;

                // Match Pitch
                const pitch = BABYLON.MeshBuilder.CreatePlane("pitch", {width: 3.05, height: 20.12}, scene);
                pitch.rotation.x = Math.PI / 2; pitch.position.y = 0.02;
                const pMat = new BABYLON.StandardMaterial("pMat", scene);
                pMat.diffuseColor = new BABYLON.Color3(0.72, 0.58, 0.42);
                pMat.roughness = 0.9;
                pitch.material = pMat;
                pitch.receiveShadows = true;

                // Boundary Advertising Rings
                const rope = BABYLON.MeshBuilder.CreateTorus("rope", {diameter: 160, thickness: 0.5, tessellation: 64}, scene);
                rope.position.y = 0.3;
                rope.material = new BABYLON.StandardMaterial("rMat", scene);
                rope.material.diffuseColor = new BABYLON.Color3(0.9, 0.9, 0.9);
                shadowGen.addShadowCaster(rope);

                // Stumps & Bails
                const stumpMat = new BABYLON.StandardMaterial("sMat", scene);
                stumpMat.diffuseColor = new BABYLON.Color3(0.95, 0.95, 0.95);
                function buildStumps(z) {
                    for (let i = -1; i <= 1; i++) {
                        const s = BABYLON.MeshBuilder.CreateCylinder("stump", {height: 0.71, diameter: 0.035}, scene);
                        s.position = new BABYLON.Vector3(i * 0.11, 0.355, z);
                        s.material = stumpMat; shadowGen.addShadowCaster(s);
                    }
                }
                buildStumps(10.06); buildStumps(-10.06);

                // --- Fluid Organic Humanoid Generator ---
                const blueMat = new BABYLON.StandardMaterial("blue", scene); blueMat.diffuseColor = new BABYLON.Color3(0.05, 0.3, 0.8);
                const goldMat = new BABYLON.StandardMaterial("gold", scene); goldMat.diffuseColor = new BABYLON.Color3(0.9, 0.75, 0.1);
                const skinMat = new BABYLON.StandardMaterial("skin", scene); skinMat.diffuseColor = new BABYLON.Color3(0.75, 0.52, 0.38);
                const whitePant = new BABYLON.StandardMaterial("wpant", scene); whitePant.diffuseColor = new BABYLON.Color3(0.9, 0.9, 0.9);
                const batWood = new BABYLON.StandardMaterial("bat", scene); batWood.diffuseColor = new BABYLON.Color3(0.7, 0.5, 0.3);

                function createOrganicPlayer(shirtMat, isBatsman) {
                    const root = new BABYLON.TransformNode("root", scene);
                    
                    // Spine with organic curvature
                    const spine = new BABYLON.TransformNode("spine", scene);
                    spine.parent = root; spine.position.y = 0.85;

                    const torso = BABYLON.MeshBuilder.CreateBox("torso", {width: 0.42, height: 0.55, depth: 0.22}, scene);
                    torso.parent = spine; torso.position.y = 0.25; torso.material = shirtMat; shadowGen.addShadowCaster(torso);

                    const head = BABYLON.MeshBuilder.CreateSphere("head", {diameter: 0.23, segments: 16}, scene);
                    head.parent = torso; head.position.y = 0.42; head.scaling.z = 1.15;
                    head.material = isBatsman ? shirtMat : skinMat; shadowGen.addShadowCaster(head);

                    // Articulated Multi-Segment Limbs (Removes the stiff box look)
                    function addLimb(x, y, w, l, isArm) {
                        const piv = new BABYLON.TransformNode("piv", scene);
                        piv.parent = torso; piv.position = new BABYLON.Vector3(x, y, 0);
                        
                        const upper = BABYLON.MeshBuilder.CreateBox("upper", {width: w, height: l/2, depth: w}, scene);
                        upper.parent = piv; upper.position.y = -l/4; upper.material = isArm ? shirtMat : whitePant; shadowGen.addShadowCaster(upper);

                        const lowerPiv = new BABYLON.TransformNode("lowerPiv", scene);
                        lowerPiv.parent = upper; lowerPiv.position.y = -l/2;
                        
                        const lower = BABYLON.MeshBuilder.CreateBox("lower", {width: w*0.8, height: l/2, depth: w*0.8}, scene);
                        lower.parent = lowerPiv; lower.position.y = -l/4; lower.material = isArm ? skinMat : whitePant; shadowGen.addShadowCaster(lower);

                        return { piv, lowerPiv };
                    }

                    const lArm = addLimb(-0.28, 0.2, 0.09, 0.58, true);
                    const rArm = addLimb(0.28, 0.2, 0.09, 0.58, true);
                    const lLeg = addLimb(-0.12, -0.3, 0.13, 0.68, false);
                    const rLeg = addLimb(0.12, -0.3, 0.13, 0.68, false);

                    let bat = null;
                    if (isBatsman) {
                        bat = BABYLON.MeshBuilder.CreateBox("bat", {width: 0.09, height: 0.85, depth: 0.03}, scene);
                        bat.parent = rArm.lowerPiv; bat.position = new BABYLON.Vector3(0, -0.5, 0.08); bat.material = batWood; shadowGen.addShadowCaster(bat);
                        torso.rotation.y = -Math.PI / 2.2;
                        lArm.piv.rotation.x = -Math.PI / 4; lArm.piv.rotation.z = 0.3;
                        rArm.piv.rotation.x = -Math.PI / 3;
                    }
                    return { root, spine, torso, lArm, rArm, lLeg, rLeg, bat, dist: 0 };
                }

                const bowler = createOrganicPlayer(blueMat, false);
                bowler.root.position = new BABYLON.Vector3(1.5, 0, -25);

                const striker = createOrganicPlayer(goldMat, true);
                striker.root.position = new BABYLON.Vector3(0, 0, 8.84);

                const fielders = [];
                for(let i=0; i<8; i++) {
                    const f = createOrganicPlayer(blueMat, false);
                    const angle = (i / 8) * Math.PI * 2;
                    f.root.position = new BABYLON.Vector3(Math.cos(angle)*38, 0, Math.sin(angle)*38);
                    f.root.lookAt(new BABYLON.Vector3(0,0,10));
                    fielders.push(f);
                }

                const ball = BABYLON.MeshBuilder.CreateSphere("ball", {diameter: 0.11}, scene);
                ball.material = new BABYLON.StandardMaterial("bMat", scene);
                ball.material.diffuseColor = new BABYLON.Color3(1, 1, 1);
                ball.position.y = -10; shadowGen.addShadowCaster(ball);

                // Simulation Engine Loop
                let state = 0; 
                let timer = 0;
                let ballVel = new BABYLON.Vector3();
                const commEl = document.getElementById('commentary');
                const dirEl = document.getElementById('director-cam');

                function applyFluidKinematics(char, speed, dt) {
                    char.dist += speed * dt;
                    const p = char.dist * 3.2;
                    // Natural fluid joint rotation with knee-bending constraints
                    char.lLeg.piv.rotation.x = Math.sin(p) * 0.75;
                    char.lLeg.lowerPiv.rotation.x = Math.max(0, Math.sin(p)) * 0.6;
                    
                    char.rLeg.piv.rotation.x = Math.sin(p + Math.PI) * 0.75;
                    char.rLeg.lowerPiv.rotation.x = Math.max(0, Math.sin(p + Math.PI)) * 0.6;
                    
                    if(!char.bat) {
                        char.lArm.piv.rotation.x = Math.sin(p + Math.PI) * 0.55;
                        char.rArm.piv.rotation.x = Math.sin(p) * 0.55;
                    }
                }

                function resetMatch() {
                    bowler.root.position.set(1.5, 0, -25);
                    bowler.rArm.piv.rotation.x = 0; bowler.torso.rotation.x = 0;
                    ball.position.y = -10;
                    state = 0; timer = 0;
                    commEl.innerHTML = "Overs: 48.4 | CRR: 6.46<br><b style='color:#fff'>Bowler running in smoothly...</b>";
                }

                scene.onBeforeRenderObservable.add(() => {
                    const dt = engine.getDeltaTime() / 1000;
                    const time = performance.now() * 0.003;

                    // Organic breathing curve for waiting batsman
                    striker.spine.rotation.x = Math.sin(time * 3) * 0.025;

                    // Cinematic Camera Control
                    if (state === 0 || state === 1) {
                        dirEl.innerText = "CAM: BROADCAST STUMP CAM";
                        camera.position = BABYLON.Vector3.Lerp(camera.position, new BABYLON.Vector3(0, 3.5, -18), 0.05);
                        camera.setTarget(BABYLON.Vector3.Lerp(camera.getTarget(), new BABYLON.Vector3(0, 1, 9), 0.05));
                    } else if (state === 2) {
                        dirEl.innerText = "CAM: HAWK-EYE TRACKER";
                        camera.position = BABYLON.Vector3.Lerp(camera.position, new BABYLON.Vector3(-12, 3, 2), 0.08);
                        camera.setTarget(ball.position);
                    } else if (state === 3) {
                        dirEl.innerText = "CAM: BOUNDARY CHASE";
                        camera.position = BABYLON.Vector3.Lerp(camera.position, ball.position.clone().add(new BABYLON.Vector3(12, 5, 12)), 0.05);
                        camera.setTarget(ball.position);
                    }

                    // Match State Machine
                    if (state === 0) {
                        const spd = 7.5;
                        bowler.root.position.z += spd * dt;
                        applyFluidKinematics(bowler, spd, dt);
                        bowler.torso.position.y = 1.05 + Math.abs(Math.sin(bowler.dist * 4)) * 0.08;

                        if (bowler.root.position.z >= -10.5) { state = 1; timer = 0; }
                    }
                    else if (state === 1) {
                        timer += dt * 14;
                        bowler.rArm.piv.rotation.x = -timer;
                        bowler.torso.rotation.x = 0.35; // Weight distribution lean
                        
                        if (timer > Math.PI * 0.8) {
                            state = 2;
                            ball.position.set(bowler.root.position.x - 0.4, 2.1, bowler.root.position.z + 1);
                            ballVel.set((Math.random()-0.5)*1.2, -2.2, 37);
                        }
                    }
                    else if (state === 2) {
                        ballVel.y -= 9.8 * dt;
                        ball.position.addInPlace(ballVel.scale(dt));

                        if (ball.position.y < 0.06 && ball.position.z < 8) {
                            ball.position.y = 0.06;
                            ballVel.y = Math.abs(ballVel.y) * 0.76;
                        }

                        if (ball.position.z > 8.8 && ball.position.z < 9.8) {
                            state = 3; timer = 0;
                            const shot = Math.random();
                            striker.torso.rotation.y = shot > 0.4 ? 0 : Math.PI / 3; 
                            striker.rArm.piv.rotation.x = Math.PI / 1.1; 

                            if (shot > 0.5) {
                                ballVel.set((Math.random() - 0.5) * 45, 17 + Math.random() * 8, -32 - Math.random() * 15);
                                commEl.innerHTML = "Overs: 48.4 | CRR: 6.46<br><b style='color:#00ffcc; font-size:16px;'>In the slot and dispatched for SIX!</b>";
                            } else {
                                ballVel.set((Math.random() - 0.5) * 35, 1, -35 - Math.random() * 10);
                                commEl.innerHTML = "Overs: 48.4 | CRR: 6.46<br><b style='color:#ffcc00; font-size:16px;'>Exquisite square drive to the fence!</b>";
                            }
                        }
                    }
                    else if (state === 3) {
                        ballVel.y -= 9.8 * dt;
                        ball.position.addInPlace(ballVel.scale(dt));
                        if (ball.position.y < 0.06) { ball.position.y = 0.06; ballVel.y *= -0.4; ballVel.x *= 0.97; ballVel.z *= 0.97; }

                        fielders.forEach(f => f.root.lookAt(new BABYLON.Vector3(ball.position.x, 0, ball.position.z)));

                        timer += dt;
                        if (timer > 4 || ball.position.length() > 75) {
                            state = 4; timer = 0;
                            if (ball.position.length() > 75) commEl.innerHTML = "Overs: 48.4 | CRR: 6.46<br><b style='color:#ff0044; font-size:18px;'>IT RUNS ALL THE WAY FOR FOUR!</b>";
                        }
                    }
                    else if (state === 4) {
                        timer += dt;
                        if (timer > 2.5) resetMatch();
                    }
                });

                return scene;
            };

            const scene = createScene();
            engine.runRenderLoop(() => {
                scene.render();
            });

            window.addEventListener("resize", () => {
                engine.resize();
            });
        });
    </script>
</body>
</html>
