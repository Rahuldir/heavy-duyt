<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Cricket Broadcast - Babylon.js</title>
    <style>
        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050510; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { width: 100%; height: 100%; outline: none; touch-action: none; display: block; }
        
        #broadcast-hud {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(10,10,30,0.95) 0%, rgba(30,30,80,0.95) 100%);
            color: white; border-radius: 8px; border-bottom: 5px solid #ff0044;
            display: flex; align-items: center; padding: 10px 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 100; pointer-events: none;
            width: 650px; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .team-score { font-size: 32px; display: flex; align-items: center; gap: 12px; font-weight: 900; font-family: 'Impact', sans-serif; letter-spacing: 2px; }
        .team-red { color: #ff3333; }
        .team-yellow { color: #ffcc00; }
        .match-info { text-align: center; font-size: 13px; color: #ccc; text-transform: uppercase; letter-spacing: 1px; line-height: 1.4;}
        
        #director-cam {
            position: absolute; top: 20px; right: 20px; background: rgba(220, 0, 0, 0.9);
            color: white; padding: 6px 14px; font-weight: bold; border-radius: 4px; z-index: 100; font-size: 12px; letter-spacing: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-transform: uppercase; pointer-events: none;
        }
    </style>
    <!-- Babylon.js CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>

    <div id="director-cam">CAM: TACTICAL WIDE</div>
    
    <div id="broadcast-hud">
        <div class="team-score"><span style="color:#aaa; font-size:20px;">IND</span> <span class="team-red">284/5</span></div>
        <div class="match-info" id="commentary">Overs: 47.1 | CRR: 6.02<br><b style="color:#fff; font-size:15px;">Live Match Simulation Active</b></div>
        <div class="team-score"><span class="team-yellow">AUS</span></div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById("renderCanvas");
            const engine = new BABYLON.Engine(canvas, true);

            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.35, 0.65, 0.9, 1);
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogColor = new BABYLON.Color3(0.35, 0.65, 0.9);
            scene.fogDensity = 0.002;

            // Camera Setup
            const camera = new BABYLON.UniversalCamera("Cam", new BABYLON.Vector3(0, 5, -25), scene);
            camera.setTarget(new BABYLON.Vector3(0, 1, 9));

            // Lighting
            const ambient = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            ambient.intensity = 0.7;

            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.5, -1, 0.5), scene);
            sun.position = new BABYLON.Vector3(50, 100, -50);
            sun.intensity = 1.3;

            const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
            shadowGen.useBlurExponentialShadowMap = true;
            shadowGen.blurKernel = 32;

            // Turf & Pitch
            const grassTex = new BABYLON.DynamicTexture("grass", {width: 512, height: 512}, scene, false);
            const ctx = grassTex.getContext();
            for (let i = 0; i < 16; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#3f9b2d' : '#378827';
                ctx.fillRect(i * 32, 0, 32, 512);
            }
            grassTex.update();
            grassTex.uScale = 20; grassTex.vScale = 20;

            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 300, height: 300}, scene);
            ground.material = new BABYLON.StandardMaterial("gMat", scene);
            ground.material.diffuseTexture = grassTex;
            ground.receiveShadows = true;

            const pitch = BABYLON.MeshBuilder.CreatePlane("pitch", {width: 3.05, height: 20.12}, scene);
            pitch.rotation.x = Math.PI / 2; pitch.position.y = 0.02;
            pitch.material = new BABYLON.StandardMaterial("pMat", scene);
            pitch.material.diffuseColor = new BABYLON.Color3(0.82, 0.7, 0.55);
            pitch.receiveShadows = true;

            const rope = BABYLON.MeshBuilder.CreateTorus("rope", {diameter: 160, thickness: 0.6, tessellation: 64}, scene);
            rope.position.y = 0.3;
            rope.material = new BABYLON.StandardMaterial("rMat", scene);
            rope.material.diffuseColor = new BABYLON.Color3(1, 1, 1);
            shadowGen.addShadowCaster(rope);

            // Stumps
            const stumpMat = new BABYLON.StandardMaterial("sMat", scene);
            stumpMat.diffuseColor = new BABYLON.Color3(0.9, 0.9, 0.9);
            function buildStumps(z) {
                for (let i = -1; i <= 1; i++) {
                    const s = BABYLON.MeshBuilder.CreateCylinder("stump", {height: 0.71, diameter: 0.04}, scene);
                    s.position = new BABYLON.Vector3(i * 0.11, 0.355, z);
                    s.material = stumpMat; shadowGen.addShadowCaster(s);
                }
            }
            buildStumps(10.06); buildStumps(-10.06);

            // Character Materials
            const redMat = new BABYLON.StandardMaterial("red", scene); redMat.diffuseColor = new BABYLON.Color3(0.85, 0.1, 0.1);
            const yelMat = new BABYLON.StandardMaterial("yel", scene); yelMat.diffuseColor = new BABYLON.Color3(0.95, 0.8, 0.1);
            const skinMat = new BABYLON.StandardMaterial("skin", scene); skinMat.diffuseColor = new BABYLON.Color3(0.8, 0.6, 0.4);
            const pantMat = new BABYLON.StandardMaterial("pant", scene); pantMat.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.15);
            const batMat = new BABYLON.StandardMaterial("bat", scene); batMat.diffuseColor = new BABYLON.Color3(0.8, 0.6, 0.3);

            function createPlayer(shirtMat, isBatsman) {
                const root = new BABYLON.TransformNode("root", scene);
                const torso = BABYLON.MeshBuilder.CreateBox("torso", {width: 0.45, height: 0.6, depth: 0.25}, scene);
                torso.parent = root; torso.position.y = 1.05; torso.material = shirtMat; shadowGen.addShadowCaster(torso);

                const head = BABYLON.MeshBuilder.CreateBox("head", {width: 0.22, height: 0.25, depth: 0.22}, scene);
                head.parent = torso; head.position.y = 0.45; head.material = isBatsman ? shirtMat : skinMat; shadowGen.addShadowCaster(head);

                function addLimb(x, y, w, l, isArm) {
                    const piv = new BABYLON.TransformNode("piv", scene);
                    piv.parent = torso; piv.position = new BABYLON.Vector3(x, y, 0);
                    const m = BABYLON.MeshBuilder.CreateBox("m", {width: w, height: l, depth: w}, scene);
                    m.parent = piv; m.position.y = -l/2; m.material = isArm ? skinMat : pantMat; shadowGen.addShadowCaster(m);
                    return piv;
                }

                const lArm = addLimb(-0.3, 0.25, 0.12, 0.6, true);
                const rArm = addLimb(0.3, 0.25, 0.12, 0.6, true);
                const lLeg = addLimb(-0.13, -0.3, 0.16, 0.65, false);
                const rLeg = addLimb(0.13, -0.3, 0.16, 0.65, false);

                let bat = null;
                if (isBatsman) {
                    bat = BABYLON.MeshBuilder.CreateBox("bat", {width: 0.1, height: 0.85, depth: 0.03}, scene);
                    bat.parent = rArm; bat.position = new BABYLON.Vector3(0, -0.7, 0.1); bat.material = batMat; shadowGen.addShadowCaster(bat);
                    torso.rotation.y = -Math.PI / 2.2;
                    lArm.rotation.x = -Math.PI / 4; rArm.rotation.x = -Math.PI / 3;
                }
                return { root, torso, lArm, rArm, lLeg, rLeg, bat, dist: 0 };
            }

            const bowler = createPlayer(redMat, false);
            bowler.root.position = new BABYLON.Vector3(1.5, 0, -25);

            const striker = createPlayer(yelMat, true);
            striker.root.position = new BABYLON.Vector3(0, 0, 8.84);

            const fielders = [];
            for(let i=0; i<8; i++) {
                const f = createPlayer(redMat, false);
                const angle = (i / 8) * Math.PI * 2;
                f.root.position = new BABYLON.Vector3(Math.cos(angle)*35, 0, Math.sin(angle)*35);
                f.root.lookAt(new BABYLON.Vector3(0,0,10));
                fielders.push(f);
            }

            const ball = BABYLON.MeshBuilder.CreateSphere("ball", {diameter: 0.12}, scene);
            ball.material = new BABYLON.StandardMaterial("bMat", scene);
            ball.material.diffuseColor = new BABYLON.Color3(1, 1, 1);
            ball.position.y = -10; shadowGen.addShadowCaster(ball);

            // Simulation Logic
            let state = 0; 
            let timer = 0;
            let ballVel = new BABYLON.Vector3();
            const commEl = document.getElementById('commentary');
            const dirEl = document.getElementById('director-cam');

            function animateLegs(char, speed, dt) {
                char.dist += speed * dt;
                const p = char.dist * 3;
                char.lLeg.rotation.x = Math.sin(p) * 0.7;
                char.rLeg.rotation.x = Math.sin(p + Math.PI) * 0.7;
                if(!char.bat) {
                    char.lArm.rotation.x = Math.sin(p + Math.PI) * 0.6;
                    char.rArm.rotation.x = Math.sin(p) * 0.6;
                }
            }

            scene.onBeforeRenderObservable.add(() => {
                const dt = engine.getDeltaTime() / 1000;

                // Director Camera Angles
                if (state === 0 || state === 1) {
                    dirEl.innerText = "CAM: UMPIRE HIGH";
                    camera.position = BABYLON.Vector3.Lerp(camera.position, new BABYLON.Vector3(0, 4, -20), 0.05);
                    camera.setTarget(BABYLON.Vector3.Lerp(camera.getTarget(), new BABYLON.Vector3(0, 1, 9), 0.05));
                } else if (state === 2) {
                    dirEl.innerText = "CAM: TRACKING";
                    camera.position = BABYLON.Vector3.Lerp(camera.position, new BABYLON.Vector3(-10, 3, 0), 0.08);
                    camera.setTarget(ball.position);
                } else if (state === 3) {
                    dirEl.innerText = "CAM: BOUNDARY CHASE";
                    camera.position = BABYLON.Vector3.Lerp(camera.position, ball.position.clone().add(new BABYLON.Vector3(12, 6, 12)), 0.05);
                    camera.setTarget(ball.position);
                }

                // Match Automation State Machine
                if (state === 0) {
                    const spd = 7.5;
                    bowler.root.position.z += spd * dt;
                    animateLegs(bowler, spd, dt);
                    if (bowler.root.position.z >= -10.5) { state = 1; timer = 0; }
                }
                else if (state === 1) {
                    timer += dt * 15;
                    bowler.rArm.rotation.x = -timer;
                    if (timer > Math.PI * 0.8) {
                        state = 2;
                        ball.position.set(bowler.root.position.x - 0.4, 2.2, bowler.root.position.z + 1);
                        ballVel.set((Math.random()-0.5)*1.5, -2.5, 36);
                    }
                }
                else if (state === 2) {
                    ballVel.y -= 9.8 * dt;
                    ball.position.addInPlace(ballVel.scale(dt));

                    if (ball.position.y < 0.06 && ball.position.z < 8) {
                        ball.position.y = 0.06;
                        ballVel.y = Math.abs(ballVel.y) * 0.75;
                    }

                    if (ball.position.z > 8.8 && ball.position.z < 9.8) {
                        state = 3; timer = 0;
                        const shot = Math.random();
                        striker.torso.rotation.y = shot > 0.5 ? 0 : Math.PI / 4; 
                        striker.rArm.rotation.x = Math.PI / 1.2; 

                        if (shot > 0.6) {
                            ballVel.set((Math.random() - 0.5) * 40, 16 + Math.random() * 8, -30 - Math.random() * 15);
                            commEl.innerHTML = "Overs: 47.1 | CRR: 6.02<br><b style='color:#ffcc00'>Shot in the air... and it's a Maximum!</b>";
                        } else {
                            ballVel.set((Math.random() - 0.5) * 35, 1, -30 - Math.random() * 10);
                            commEl.innerHTML = "Overs: 47.1 | CRR: 6.02<br><b style='color:#ffcc00'>Glorious cover drive to the fence!</b>";
                        }
                    }
                }
                else if (state === 3) {
                    ballVel.y -= 9.8 * dt;
                    ball.position.addInPlace(ballVel.scale(dt));
                    if (ball.position.y < 0.06) { ball.position.y = 0.06; ballVel.y *= -0.5; ballVel.x *= 0.98; ballVel.z *= 0.98; }

                    fielders.forEach(f => f.root.lookAt(new BABYLON.Vector3(ball.position.x, 0, ball.position.z)));

                    timer += dt;
                    if (timer > 4 || ball.position.length() > 75) {
                        state = 4; timer = 0;
                        if (ball.position.length() > 75) commEl.innerHTML = "Overs: 47.1 | CRR: 6.02<br><b style='color:#ff0044'>FOUR RUNS! Magnificent stroke!</b>";
                    }
                }
                else if (state === 4) {
                    timer += dt;
                    if (timer > 2) {
                        bowler.root.position.set(1.5, 0, -25);
                        bowler.rArm.rotation.x = 0; bowler.torso.rotation.x = 0;
                        ball.position.y = -10;
                        commEl.innerHTML = "Overs: 47.1 | CRR: 6.02<br><b style='color:#fff'>Bowler running in...</b>";
                        state = 0;
                    }
                }
            });

            engine.runRenderLoop(() => {
                scene.render();
            });

            window.addEventListener("resize", () => {
                engine.resize();
            });
        });
    </script>
</body>
</html>
